<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html",
            "modules": {
                "http://epiwen.org/templates/jinshi": {
                    "at": "modules/templates/jinshi.xqm",
                    "prefix": "jinshi"
                }
            }
        },
        "features": {
            "toolbar": {
                "zoom": false,
                "navigation": false
            },
            "timeline": {
                "enabled": false
            },
            "upload": {
                "enabled": false
            }
        },
        "styles": [
            "transform/teipublisher.css",
            "resources/css/registers-theme.css"
        ],
        "theme": {
            "layout": {
                "after-width": "min(30vw, 356px)"
            },
            "footer": {
                "mobile": {
                    "enabled": false
                }
            }
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li><a href="[[ $context-path ]]/people"><pb-i18n key="menu.people"/></a></li>
                <li>[[ $entity-data?root/head((tei:persName[@type = ('reg', 'main', 'full')], tei:persName))/string() ]]</li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]
    <section class="person">
        [[ page:transform($entity-data?root, map { "mode": "register-details" , "webcomponents": true()}) ]]

        [% let $works = jinshi:works-of-person($entity-data?id) %]
        [% if exists($works) %]
        <section class="person-works">
            <h2><pb-i18n key="jinshi.works-by">Jinshi works 金石著作</pb-i18n>
                <span class="count">([[ count($works) ]])</span></h2>
            <ul class="person-works-list">
                [% for $w in $works %]
                <li>
                    <a class="zh" href="[[ $context-path ]]/works/[[ $w?id ]]">[[ $w?title ]]</a>
                    [% if $w?date != '' %]<small class="date">[[ $w?date ]]</small>[% endif %]
                    [% if $w?role = 'contributor' %]<small class="role"><pb-i18n key="jinshi.contributor">contributor</pb-i18n></small>[% endif %]
                </li>
                [% endfor %]
            </ul>
        </section>
        [% endif %]
        [% endlet %]
    </section>
</template>
