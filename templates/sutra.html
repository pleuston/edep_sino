<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html"
        },
        "features": {
            "toolbar": {
                "zoom": false,
                "navigation": false
            },
            "timeline": {
                "enabled": false
            },
            "upload": {
                "enabled": false
            }
        },
        "styles": [
            "transform/teipublisher.css",
            "resources/css/registers-theme.css"
        ]
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li><a href="[[ $context-path ]]/sutras"><pb-i18n key="menu.sutras"/></a></li>
                <li>[[ head(($entity-data?root//tei:objectName[@type='main'], $entity-data?root//tei:objectName))/string() ]]</li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]
    <section class="sutra jinshi-detail">
        <h1 class="zh">[[ head(($entity-data?root//tei:objectName[@type='main'], $entity-data?root//tei:objectName))/string() ]]</h1>
        [% if $entity-data?root//tei:objectName[@type='sort'] != '' %]
        <p class="pinyin">[[ $entity-data?root//tei:objectName[@type='sort']/string() ]]</p>
        [% endif %]
        [% if exists($entity-data?root//tei:objectName[@type='alt']) %]
        <p class="altnames">[[ string-join($entity-data?root//tei:objectName[@type='alt'], '；') ]]</p>
        [% endif %]

        <dl class="work-meta">
            [% if $entity-data?root//tei:origin/tei:origDate != '' %]
            <dt><pb-i18n key="jinshi.origin">Origin</pb-i18n></dt>
            <dd><span class="zh">[[ $entity-data?root//tei:origin/tei:origDate/string() ]]</span>
                [% if $entity-data?root//tei:origin/tei:origDate[@when or @notBefore] %]<span class="gregorian">（[[ head(($entity-data?root//tei:origin/tei:origDate/@when[. != ''], string-join(($entity-data?root//tei:origin/tei:origDate/@notBefore, $entity-data?root//tei:origin/tei:origDate/@notAfter), '–'))) ]] CE）</span>[% endif %]</dd>
            [% endif %]
            [% let $place = $entity-data?root//tei:origin/tei:origPlace/@corresp/string() %]
            [% if $place != '' %]
            <dt><pb-i18n key="sutras.location">Site</pb-i18n></dt>
            <dd><a href="[[ $context-path ]]/places/[[ $place ]]">[[ head((collection($config:register-root)/id($place)//tei:placeName[@type='main']/string(), $place)) ]]</a>
                [% if $entity-data?root//tei:idno[@type='corpus-loc'] != '' %]
                <small class="corpus-loc">· [[ $entity-data?root//tei:idno[@type='corpus-loc']/string() ]]</small>
                [% endif %]</dd>
            [% endif %]
            [% endlet %]
            [% if $entity-data?root//tei:idno[@type='sutra-corpus'] != '' %]
            <dt><pb-i18n key="sutras.corpus">Corpus</pb-i18n></dt>
            <dd>[[ $entity-data?root//tei:idno[@type='sutra-corpus']/string() ]]</dd>
            [% endif %]
            [% if exists($entity-data?root//tei:idno[@type='taisho']) %]
            <dt><pb-i18n key="sutras.taisho">Taishō canon</pb-i18n></dt>
            <dd>[[ string-join($entity-data?root//tei:idno[@type='taisho'] ! replace(., '_', ' '), '; ') ]]</dd>
            [% endif %]
        </dl>

        [% let $cid = $entity-data?root//tei:idno[@type='corpus']/string() %]
        [% if $cid != '' %]
        <section class="corpus-link">
            <a class="corpus-edition" href="[[ $context-path ]]/[[ $cid ]].xml">
                <pb-i18n key="sutras.edition">Transcription (this corpus)</pb-i18n>
            </a>
            <!-- verification badge (doc/sino-model.md §11, 核验): the edition's
                 revisionDesc/@status, read live from the edition (single source of truth). -->
            [% if collection($config:data-root)/id($cid)//tei:revisionDesc/@status = 'verified' %]<span class="verify-badge verify-verified"><pb-i18n key="form.status-verified"/></span>[% endif %]
            [% if collection($config:data-root)/id($cid)//tei:revisionDesc/@status = 'reviewed' %]<span class="verify-badge verify-reviewed"><pb-i18n key="form.status-reviewed"/></span>[% endif %]
            [% if empty(collection($config:data-root)/id($cid)//tei:revisionDesc/@status) or collection($config:data-root)/id($cid)//tei:revisionDesc/@status = 'draft' %]<span class="verify-badge verify-draft"><pb-i18n key="form.status-draft"/></span>[% endif %]
        </section>
        [% endif %]
        [% endlet %]

        <!-- one support → many texts (doc/sino-model.md §11, E-SUP): sibling inscriptions
             sharing this support key (idno[@type='support']), e.g. HDS_9.1…HDS_9.16. -->
        [% if exists(collection($config:register-root)/id($config:register-map?sutra?id)//tei:object[tei:objectIdentifier/tei:idno[@type='support'] = $entity-data?root//tei:idno[@type='support']][@xml:id != $entity-data?root/@xml:id]) %]
        <section class="same-support">
            <h2><pb-i18n key="sutras.same-support">Other texts on this support</pb-i18n></h2>
            <ul class="same-support-list">
            [% for $sib in collection($config:register-root)/id($config:register-map?sutra?id)//tei:object[tei:objectIdentifier/tei:idno[@type='support'] = $entity-data?root//tei:idno[@type='support']][@xml:id != $entity-data?root/@xml:id] %]
                <li><a href="[[ $context-path ]]/sutras/[[ $sib/@xml:id/string() ]]">[[ head(($sib//tei:objectName[@type='main'], $sib//tei:objectName))/string() ]]</a></li>
            [% endfor %]
            </ul>
        </section>
        [% endif %]

        [% for $n in $entity-data?root/tei:note[not(@type='source')] %]
        <p class="note">[[ $n/string() ]]</p>
        [% endfor %]
    </section>
</template>
