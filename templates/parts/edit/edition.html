<details class="group-6" id="edition">
    <summary>
        <h2><pb-i18n key="form.edition">Textedition</pb-i18n>
            <pb-popover>
                <edep-icon name="info-outline"></edep-icon>
                <template slot="alternate">
                    <pb-i18n key="form.hint-text-edition">Hint</pb-i18n>
                </template>
            </pb-popover>
        </h2>
    </summary>
    <div class="block" id="transcript">
        <h4>
            <pb-i18n key="form.transcription">Transkription</pb-i18n>
        </h4>
        <fx-control
          class="transcription editor"
          ref="div[@type='edition']"
          as="node"
          update-event="leave">
            <jinn-epidoc-editor
              id="transcriptionEditor"
              unwrap="unwrap"
              class="widget"
              show-leiden=""
              schema="resources/scripts/tei.json"
              schema-root="div"
              mode="leiden_plus">
                <h5 slot="leiden-header">Leiden+ Editor</h5>
                <div slot="leiden-toolbar">
                    <button
                      data-command="snippet"
                      data-mode="leiden_plus"
                      data-params="($|_|)"
                      title="Abbreviation parenthesis">
                        (abc)
                    </button>
                    <button
                      data-command="expan"
                      data-mode="leiden_plus"
                      title="Expanded abbreviation">
                        (a(bcd))
                    </button>
                    <button
                      data-command="erasure"
                      data-mode="leiden_plus"
                      title="Erasure">
                        〚abc〛
                    </button>
                    <button
                      data-command="unclear"
                      data-mode="leiden_plus"
                      title="Unclear">
                        ạ
                    </button>
                    <button
                      data-command="snippet"
                      data-mode="leiden_plus"
                      data-params="~|$|_||~$|2:gr|"
                      title="Language switch">
                        ~|...|~
                    </button>
                    <button data-command="div" data-mode="leiden_plus" title="Division">
                        &lt;=...
                    </button>
                    <button
                      data-command="snippet"
                      data-mode="leiden_plus"
                      title="Part"
                      data-params="&lt;D=.$|A|.part&lt;=$|_|=&gt;=D&gt;">
                        &lt;D=.A.part...
                    </button>
                    <button
                      data-command="snippet"
                      data-mode="leiden_plus"
                      title="Column"
                      data-params="&lt;D=.$|i|.column&lt;=$|_|=&gt;=D&gt;">
                        &lt;D=.i.column...
                    </button>
                    <button
                      data-command="snippet"
                      data-mode="leiden_plus"
                      title="Recto/Verso"
                      data-params="&lt;D=.$|r|&lt;=$|_|=&gt;=D&gt;">
                        &lt;D=.r...
                    </button>
                    <button
                      data-command="fixNewlines"
                      data-mode="leiden_plus"
                      title="Add missing line numbers">
                        ↩
                    </button>
                    <button data-command="erasure" data-mode="edcs">〚abc〛</button>
                    <button data-command="gap" data-mode="edcs">[...]</button>
                    <button data-command="convert" data-mode="edcs">
                        Convert to Leiden+
                    </button>
                </div>
                <h5 slot="xml-header">EpiDoc XML Editor
                </h5>
                <div slot="xml-toolbar">
                    <button
                      data-command="selectElement"
                      title="Select element around current cursor position">
                        &lt;|&gt;
                    </button>
                    <button
                      data-command="encloseWith"
                      title="Enclose selection in new element">
                        &lt;...&gt;
                    </button>
                    <button
                      data-command="removeEnclosing"
                      title="Remove enclosing tags"
                      class="sep">
                        &lt;X&gt;
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;ab&gt;$|_|&lt;/ab&gt;"
                      title="Insert ab">
                        &lt;ab&gt;
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;supplied reason=&#34;lost&#34;&gt;$|_|&lt;/supplied&gt;"
                      title="Insert supplied">
                        &lt;supplied&gt;
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;expan&gt;&lt;abbr&gt;$|1|&lt;/abbr&gt;&lt;ex&gt;$|_|&lt;/ex&gt;&lt;/expan&gt;$|3|"
                      title="Insert expan/abbr">
                        &lt;expan&gt;
                    </button>
                    <!-- sino routing table, doc/sino-model.md par.4 + par.2 -->
                    <button class="sep"
                      data-command="snippet"
                      data-params="&lt;choice&gt;&lt;sic&gt;$|1|&lt;/sic&gt;&lt;corr&gt;$|_|&lt;/corr&gt;&lt;/choice&gt;"
                      title="誤字 carver error: sic/corr">
                        誤字
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;choice ana=&#34;#jiajie&#34;&gt;&lt;orig&gt;$|1|&lt;/orig&gt;&lt;reg&gt;$|_|&lt;/reg&gt;&lt;/choice&gt;"
                      title="通假字 phonetic loan: orig/reg">
                        通假
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;choice ana=&#34;#bihui&#34;&gt;&lt;orig&gt;$|1|&lt;/orig&gt;&lt;reg&gt;$|_|&lt;/reg&gt;&lt;/choice&gt;"
                      title="避諱 taboo substitution: orig/reg">
                        避諱
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;g ref=&#34;#$|1|&#34;&gt;$|_|&lt;/g&gt;"
                      title="異體字/缺字 glyph reference (charDecl)">
                        異體
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;space dim=&#34;vertical&#34; quantity=&#34;1&#34; unit=&#34;character&#34; subtype=&#34;que-zi&#34;/&gt;"
                      title="闕字 honorific blank">
                        闕字
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;lb n=&#34;$|1|&#34; rend=&#34;taitou-ping&#34;/&gt;"
                      title="抬頭 raised head column break">
                        抬頭
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;gap reason=&#34;lost&#34; quantity=&#34;$|1|&#34; unit=&#34;character&#34;/&gt;"
                      title="缺/殘 lost characters">
                        缺
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;gap reason=&#34;illegible&#34; quantity=&#34;$|1|&#34; unit=&#34;character&#34;/&gt;"
                      title="漫漶 illegible characters">
                        漫漶
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;gap reason=&#34;lost&#34; extent=&#34;unknown&#34; unit=&#34;character&#34;/&gt;$|1|"
                      title="Gap, extent unknown">
                        <edep-icon name="space-bar"></edep-icon>
                        ?
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;gap reason=&#34;lost&#34; quantity=&#34;$|1|&#34; unit=&#34;$|2:line|&#34;/&gt;$|3|"
                      title="Gap, extent known">
                        <edep-icon name="space-bar"></edep-icon>
                    </button>
                    <button
                      data-command="snippet"
                      data-params='&lt;hi rend="ligature">$|_|&lt;/hi>'
                      title="Ligature">
                        Lig
                    </button>
                    <button
                      data-command="snippet"
                      data-params='&lt;hi rend="apex">$|_|&lt;/hi>'
                      title="Apex">
                        Apex
                    </button>
                    <pb-popover>
                        <button
                          data-command="snippet"
                          data-params='&lt;l met="$|1|" real="$|2|">$|_|&lt;/l>'
                          title="Metric">
                            <pb-i18n key="form.verse">Verse</pb-i18n>
                        </button>
                        <template slot="alternate">
                            <pb-i18n key="form.hint-verse"></pb-i18n>
                        </template>
                    </pb-popover>
                    <pb-popover>
                        <button
                            data-command="snippet"
                            data-params="&lt;persName key=&#34;$|1|&#34;&gt;$|_|&lt;/persName&gt;"
                            title="persName">
                            <edep-icon name="person-add"></edep-icon>
                        </button>
                        <template slot="alternate">
                            <pb-i18n key="form.hint-verse"></pb-i18n>
                        </template>
                    </pb-popover>
                </div>
            </jinn-epidoc-editor>
        </fx-control>
        <h4>
            <pb-i18n key="form.display">Display</pb-i18n>
        </h4>
        <div id="transcription-display"></div>
    </div>
    <div class="block">
        <h4>
            <pb-i18n key="form.apparatus">Apparatus</pb-i18n>
        </h4>
        <fx-control
          class="apparatus editor"
          ref="div[@type='apparatus']"
          as="node"
          update-event="leave">
            <jinn-xml-editor
              id="apparatus"
              class="widget"
              unwrap="unwrap"
              schema="resources/scripts/tei.json"
              schema-root="div"
              namespace="http://www.tei-c.org/ns/1.0"
              placeholder="[Should contain a &lt;listApp&gt; with nested &lt;app&gt;]"
              base-url="[[ $context-path ]]"
              providers="zotero">
                <div slot="toolbar">
                    <button
                      data-command="selectElement"
                      title="Select element around current cursor position">
                        &lt;|&gt;
                    </button>
                    <button
                      data-command="encloseWith"
                      title="Enclose selection in new element">
                        &lt;...&gt;
                    </button>
                    <button
                      data-command="removeEnclosing"
                      title="Remove enclosing tags"
                      class="sep">
                        &lt;X&gt;
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;listApp&gt;$|_|&lt;/listApp&gt;"
                      title="Insert apparatus list">
                        &lt;listApp&gt;
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;app loc=&#34;$|1|&#34;&gt;&lt;note&gt;$|_|&lt;/note&gt;&lt;/app&gt;"
                      title="Insert apparatus entry">
                        &lt;app&gt;
                    </button>
                    <pb-popover>
                        <button
                            data-command="snippet"
                            data-params="&lt;ref type=&#34;biblio&#34; target=&#34;$|1|&#34;&gt;$|_|&lt;/ref&gt;"
                            title="Insert reference">
                            &lt;ref&gt;
                        </button>
                        <template slot="alternate">
                            <pb-i18n key="form.hint-reference"></pb-i18n>
                        </template>
                    </pb-popover>

                    <button
                      data-command="snippet"
                      data-params="&lt;persName key=&#34;$|1|&#34;&gt;$|_|&lt;/persName&gt;"
                      title="persName">
                        <edep-icon name="person-add"></edep-icon>
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;seg type=&#34;citedRange&#34;&gt;$|_|&lt;/seg&gt;"
                      title="seg">
                        &lt;seg&gt;
                    </button>
                </div>
            </jinn-xml-editor>
        </fx-control>
    </div>

    <!-- TRANSLATION -->

    <div class="block">
      <h4>
          <pb-i18n key="form.translation"/>
      </h4>
      <fx-group ref="div[@type='translation']">
        <fx-control
          class="translation editor"
          ref="."
          as="node"
          update-event="leave">
            <jinn-xml-editor
              id="translation"
              unwrap="unwrap"
              class="widget"
              placeholder="[Inline text/markup or sequence of paragraphs]"
              schema="resources/scripts/tei.json"
              schema-root="div"
              namespace="http://www.tei-c.org/ns/1.0"
              base-url="[[ $context-path ]]"
              providers="zotero">
                <div slot="toolbar">
                    <button
                      data-command="selectElement"
                      title="Select element around current cursor position">
                        &lt;|&gt;
                    </button>
                    <button
                      data-command="encloseWith"
                      title="Enclose selection in new element">
                        &lt;...&gt;
                    </button>
                    <button
                      data-command="removeEnclosing"
                      title="Remove enclosing tags"
                      class="sep">
                        &lt;X&gt;
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;p&gt;$|_|&lt;/p&gt;"
                      title="Insert paragraph">
                        &lt;p&gt;
                    </button>
                    <button
                      data-command="snippet"
                      data-params="&lt;persName key=&#34;$|1|&#34;&gt;$|_|&lt;/persName&gt;"
                      title="persName">
                        <edep-icon name="person-add"></edep-icon>
                    </button>
                </div>
            </jinn-xml-editor>
        </fx-control>
        <fx-control class="translator" ref="@resp" create="create">
            <label>
                <pb-i18n key="form.translated-by"/>:
            </label>
        </fx-control>
      </fx-group>
    </div>
</details>
