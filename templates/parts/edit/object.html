<fx-group class="outer-group" ref="fileDesc/sourceDesc/msDesc/msIdentifier" id="object" aria-labelledby="identifier-lbl">
    <h2 id="identifier-lbl">
        <pb-i18n key="form.identifier">Identifier</pb-i18n>
    </h2>
    <!-- 3) -->
    <fx-output ref="idno[@type='EDEp']" class="edepid">
        <label slot="label">
            <pb-i18n key="form.edepid">EDEp ID</pb-i18n>

            <pb-popover>
                <edep-icon name="info-outline"></edep-icon>
                <template slot="alternate">
                    <pb-i18n key="form.hint-references"></pb-i18n>
                </template>
            </pb-popover>

        </label>
    </fx-output>
    <fieldset id="idnos">
        <legend><pb-i18n key="form.identifier">Identifier</pb-i18n>
            <fx-trigger class="add">
                <pb-popover>
                    <edep-icon name="add-circle-outline"></edep-icon>
                    <template slot="alternate">
                        <pb-i18n key="form.hint-add-idno"> </pb-i18n
                        ></template>
                </pb-popover>
                <fx-insert
                    context="."
                    ref="idno"
                    origin="instance('templates')/idno"></fx-insert>
            </fx-trigger>
        </legend>
        <fx-repeat ref="idno[@type != 'EDEp' and @type != 'jinshi']" class="idno-repeat">
            <template>
                <fx-control ref="@type">
                    <label><pb-i18n key="form.idno-type">Type</pb-i18n></label>
                </fx-control>
                <fx-control class="idno" ref=".">
                    <label>
                        <pb-i18n key="form.idno">ID</pb-i18n>
                    </label>
                </fx-control>
                <fx-trigger>
                    <pb-popover>
                        <edep-icon name="remove-circle-outline"></edep-icon>
                        <template slot="alternate">
                            <pb-i18n key="form.hint-delete-idno"></pb-i18n
                            ></template>
                    </pb-popover>
                    <fx-delete ref="."></fx-delete>
                </fx-trigger>
            </template>
        </fx-repeat>
    </fieldset>

    <!-- jinshi authority cross-reference (doc/sino-model.md par.10): id of the
         matching record in the inscription authority register 石刻總目 -->
    <fx-control id="jinshi-id" class="jinshi-id" ref="idno[@type='jinshi']" update-event="input">
        <label>
            <pb-i18n key="form.jinshi-id">Authority record (石刻總目)</pb-i18n>
            <pb-popover>
                <edep-icon name="info-outline"></edep-icon>
                <template slot="alternate">
                    <pb-i18n key="form.hint-jinshi-id">Id of this inscription in the jinshi authority register, e.g. insc-000001 — links the edition to its attestation history.</pb-i18n>
                </template>
            </pb-popover>
        </label>
        <input class="widget" placeholder="insc-…"/>
    </fx-control>

    <!-- 16a) -->

<!--
    <fx-control id="tm-number" class="tm-number" ref="idno[@type='TM']">
        <label>
            <pb-i18n key="form.tm">TM ID</pb-i18n>
            <pb-popover>
                <edep-icon name="info-outline"></edep-icon>
                <template slot="alternate">
                    <pb-i18n key="form.hint-tm"></pb-i18n>
                </template>
            </pb-popover>
        </label>
    </fx-control>
-->
    <!-- there's no 17) -->
</fx-group>
