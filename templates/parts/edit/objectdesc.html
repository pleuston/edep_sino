<details id="objectdesc">
    <summary>
        <h2><pb-i18n key="form.object-description"/></h2>
    </summary>

    <fx-group class="neutral" ref="physDesc">
        <fx-group class="neutral form-row" ref="decoDesc/decoNote">
            <fx-control ref="@corresp" update-event="input" create="create">
                <label>
                    <pb-i18n key="form.decoration"/>
                </label>
                <select
                ref="sortNames(instance('decoration')//category)"
                class="widget"
                selection="open">
                    <template>
                        <!-- prettier-ignore -->
                        <option value="{@corresp}">{head((catDesc[@xml:lang = $lang], catDesc))}</option>
                    </template>
                </select>
            </fx-control>

            <fx-control class="description" ref=".">
                <label>
                    <pb-i18n key="form.decoration-description"/>
                </label>
                <textarea class="widget"></textarea>
            </fx-control>
        </fx-group>

        <fx-control ref="objectDesc/supportDesc/condition" update-event="input">
            <label>
                <pb-i18n key="form.preservation"/>
            </label>
            <select
                ref="instance('preservation')//category"
                class="widget">
                <template>
                    <!-- prettier-ignore -->
                    <option value="{@xml:id}">{catDesc[@xml:lang = $lang]}</option>
                </template>
            </select>
        </fx-control>

        <!-- visual form / medium of the object (doc/sino-model.md 8bis):
             carved stone, calligraphy, painting, ink-on-paper, seal impression… -->
        <fx-control id="visual-form" ref="objectDesc/@form" create="create" update-event="input">
            <label>
                <pb-i18n key="form.visual-form">Visual form</pb-i18n>
                <pb-popover>
                    <edep-icon name="info-outline"></edep-icon>
                    <template slot="alternate">
                        <pb-i18n key="form.hint-visual-form">Medium of the object beyond carved stone — calligraphy, painting, ink on paper, seal impression…</pb-i18n>
                    </template>
                </pb-popover>
            </label>
            <select class="widget">
                <option value=""></option>
                <fx-repeat ref="instance('medium')//category">
                    <template>
                        <option value="{@corresp}">{catDesc[@xml:lang='zh']} — {catDesc[@xml:lang = $lang]}</option>
                    </template>
                </fx-repeat>
            </select>
        </fx-control>

        <fx-group ref="objectDesc/supportDesc/support" class="neutral">
            <fieldset>
                <legend>
                    <pb-i18n key="form.type-of-monument"/>
                </legend>
                <fx-repeat
                  class="nested-repeat repeat-flex"
                  ref="objectType"
                  id="r-objtyp">
                    <template>
                        <fx-group class="neutral">
                            <fx-control ref="@ref">
                                <label>
                                    <pb-i18n key="form.type-of-monument"/>
                                </label>
                                <select
                                class="widget"
                                ref="sortNames(instance('objtyp')//category)">
                                    <template>
                                        <option value="{@corresp}">{catDesc[@xml:lang = $lang]}</option>
                                    </template>
                                </select>
                            </fx-control>
                        </fx-group>
                        <fx-trigger>
                            <pb-popover>
                                <edep-icon name="remove-circle-outline"></edep-icon>
                                <template slot="alternate">
                                    <pb-i18n key="form.hint-delete-objecttype"></pb-i18n
                                    ></template>
                            </pb-popover>
                            <fx-delete ref="."></fx-delete>
                        </fx-trigger>
                    </template>
                </fx-repeat>
                <fx-trigger class="add">
                    <pb-popover>
                        <edep-icon name="add-circle-outline"></edep-icon>
                        <template slot="alternate">
                            <pb-i18n key="form.hint-add-objecttype"> </pb-i18n
                            ></template>
                    </pb-popover>
                    <fx-insert
                        context="."
                        ref="objectType"
                        origin="instance('templates')/objectType"></fx-insert>
                </fx-trigger>
            </fieldset>

            <fx-control ref="note[not(@type)]" as="node" update-event="leave">
                <label>
                    <pb-i18n key="form.description-of-monument"/>
<!-- if it's not more we can give as hint we probably can leave away altogether (see other places also)
                    <pb-popover>
                        <edep-icon name="info-outline"></edep-icon>
                        <template slot="alternate">
                            <pb-i18n key="form.Notes"></pb-i18n>
                        </template>
                    </pb-popover>
-->
                </label>
                <edep-xml-editor
                  class="widget"
                  placeholder="[Inline text/markup or sequence of paragraphs]"
                  schema-root="provenance"
                  base-url="[[ $context-path ]]">
                </edep-xml-editor>
            </fx-control>
                
            <fieldset>
                <legend>
                    <pb-i18n key="form.material"/>
                </legend>
                <fx-repeat
                    class="nested-repeat repeat-flex"
                    ref="material"
                    id="r-material">
                    <template>
                        <fx-group class="neutral">
                            <fx-control ref="@ref">
                                <label>
                                    <pb-i18n key="form.material"/>
                                </label>
                                <select
                                class="widget"
                                ref="sortNames(instance('material')//category)">
                                    <template>
                                        <option value="{@corresp}">{catDesc[@xml:lang = $lang]}</option>
                                    </template>
                                </select>
                            </fx-control>
                        </fx-group>
                        <fx-trigger>
                            <pb-popover>
                                <edep-icon name="remove-circle-outline"></edep-icon>
                                <template slot="alternate">
                                    <pb-i18n key="form.hint-delete-material"/>
                                </template>
                            </pb-popover>
                            <fx-delete ref="."></fx-delete>
                        </fx-trigger>
                    </template>
                </fx-repeat>
                <fx-trigger class="add">
                    <pb-popover>
                        <edep-icon name="add-circle-outline"></edep-icon>
                        <template slot="alternate">
                            <pb-i18n key="form.hint-add-material"/>
                        </template>
                    </pb-popover>
                    <fx-insert
                        context="."
                        ref="material"
                        origin="instance('templates')/material"></fx-insert>
                </fx-trigger>
            </fieldset>
            <section class="measurement-row form-row">
            <fx-control class="measurement" ref="dimensions/height">
                <label>
                    <pb-i18n key="form.height"/>
                </label>
            </fx-control>
            <fx-control class="measurement" ref="dimensions/width">
                <label>
                    <pb-i18n key="form.width"/>
                </label>
            </fx-control>
            <fx-control class="measurement" ref="dimensions/depth">
                <label>
                    <pb-i18n key="form.depth"/>
                </label>
            </fx-control>
            </section>
        </fx-group>
    </fx-group>

    <div class="alternatives">
        <fx-group ref="msContents">
            <fx-control ref="summary">
                <label>
                    <pb-i18n key="form.remarks"/>
                </label>
                <textarea class="widget"></textarea>
            </fx-control>
        </fx-group>

        <fx-group class="neutral" ref="ancestor::teiHeader/profileDesc/textClass">
            <fx-group ref="keywords[@scheme='https://edh.ub.uni-heidelberg.de/edep/inscription-type']">
                <fieldset>
                    <legend>
                        <pb-i18n key="form.type-of-inscription"/>
                    </legend>
                    <fx-repeat
                        class="nested-repeat repeat-flex"
                        ref="term"
                        id="r-inscription-type">
                        <template>
                                <fx-control ref="@ref" create="create">
                                    <label>
                                        <pb-i18n key="form.type-of-inscription"/>
                                    </label>
                                    <select
                                    class="widget"
                                    ref="sortNames(instance('typeins')//category)">
                                        <template>
                                            <option value="{@corresp}">{catDesc[@xml:lang = $lang]}</option>
                                        </template>
                                    </select>
                                </fx-control>
                            <fx-trigger>
                                <pb-popover>
                                    <edep-icon name="remove-circle-outline"></edep-icon>
                                    <template slot="alternate">
                                        <pb-i18n key="form.hint-delete"/>
                                    </template>
                                </pb-popover>
                                <fx-delete ref="."></fx-delete>
                            </fx-trigger>
                        </template>
                    </fx-repeat>
                    <fx-trigger class="add">
                        <pb-popover>
                            <edep-icon name="add-circle-outline"></edep-icon>
                            <template slot="alternate">
                                <pb-i18n key="form.hint-add"/>
                            </template>
                        </pb-popover>
                        <fx-insert
                            context="."
                            ref="term"
                            origin="instance('templates')/keywords/term"></fx-insert>
                    </fx-trigger>
                </fieldset>
            </fx-group>
        </fx-group>
    </div>

    <!-- seals 鈐印 (collector & artist seals), doc/sino-model.md 8bis -->
    <fx-group class="neutral" ref="physDesc/sealDesc" id="seals">
        <fieldset>
            <legend><pb-i18n key="form.seals">Seals (鈐印)</pb-i18n></legend>
            <fx-repeat id="r-seals" ref="seal" class="nested-repeat">
                <template>
                    <fx-group class="form-row">
                        <fx-control ref="@type" create="create">
                            <label><pb-i18n key="form.seal-type">Seal type</pb-i18n></label>
                            <select class="widget">
                                <option value=""></option>
                                <fx-repeat ref="instance('sealtype')//category">
                                    <template>
                                        <option value="{@corresp}">{catDesc[@xml:lang='zh']} — {catDesc[@xml:lang = $lang]}</option>
                                    </template>
                                </fx-repeat>
                            </select>
                        </fx-control>
                        <fx-control ref="p" update-event="input">
                            <label><pb-i18n key="form.seal-legend">Seal legend (印文)</pb-i18n></label>
                            <input class="widget" placeholder="乾隆御覽之寶"/>
                        </fx-control>
                        <fx-control ref="@corresp" create="create" update-event="input">
                            <label><pb-i18n key="form.person-key">Register id</pb-i18n></label>
                            <input class="widget" placeholder="person-…"/>
                        </fx-control>
                        <fx-trigger>
                            <pb-popover>
                                <edep-icon name="remove-circle-outline"></edep-icon>
                                <template slot="alternate"><pb-i18n key="form.hint-delete-seal">Delete this seal</pb-i18n></template>
                            </pb-popover>
                            <fx-delete ref="."></fx-delete>
                        </fx-trigger>
                    </fx-group>
                </template>
            </fx-repeat>
            <fx-trigger class="add">
                <pb-popover>
                    <edep-icon name="add-circle-outline"></edep-icon>
                    <template slot="alternate"><pb-i18n key="form.hint-add-seal">Add a seal</pb-i18n></template>
                </pb-popover>
                <fx-insert context="." ref="seal" origin="instance('templates')/seal"></fx-insert>
            </fx-trigger>
        </fieldset>
    </fx-group>

</details>
