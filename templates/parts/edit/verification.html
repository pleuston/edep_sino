<details id="verification">
    <summary>
        <h2><pb-i18n key="form.verification">Verifizierung</pb-i18n></h2>
    </summary>

    <!-- Verification state machine (doc/sino-model.md §11, 核验): every edition is
         draft-by-default; promotion to reviewed/verified is a deliberate, audited
         act. The status rides revisionDesc/@status and is snapshotted into the
         append-only change trail on every save (api:postprocess). -->
    <fx-group ref="revisionDesc" class="neutral">
        <fx-control id="verification-status" ref="@status" create="create">
            <label>
                <pb-i18n key="form.verification-status">Verifizierungsstatus</pb-i18n>
                <pb-popover>
                    <edep-icon name="info-outline"></edep-icon>
                    <template slot="alternate">
                        <pb-i18n key="form.hint-verification-status">Draft = AI/import-drafted, unverified. Reviewed = adversarially checked. Verified = human-confirmed.</pb-i18n>
                    </template>
                </pb-popover>
            </label>
            <select class="widget">
                <option value="draft" data-i18n="form.status-draft">Entwurf</option>
                <option value="reviewed" data-i18n="form.status-reviewed">geprüft</option>
                <option value="verified" data-i18n="form.status-verified">verifiziert</option>
            </select>
        </fx-control>
    </fx-group>

    <fx-group ref="fileDesc/titleStmt">
        <fx-trigger class="add">
            <pb-popover>
                <edep-icon name="add-circle-outline"></edep-icon>
                <template slot="alternate">
                    <pb-i18n key="form.hint-add-verification"/>
                </template>
            </pb-popover>
            <fx-insert
              context="."
              ref="respStmt"
              origin="instance('templates')/respStmt[resp/@when]"></fx-insert>
        </fx-trigger>
        <fx-repeat
          class="nested-repeat"
          ref="respStmt"
          id="r-verification">
            <template>
                <fx-group ref="resp">                   
                    <fx-control ref=".">
                        <label>
                            <pb-i18n key="form.basis-of-verification">Verifizierungsgrundlage</pb-i18n>
                        </label>
                        <select
                        class="widget"
                        ref="sortNames(instance('verification-options')//category)">
                            <template>
                                <option value="{@xml:id}">{catDesc[@xml:lang = $lang]}</option>
                            </template>
                        </select>
                    </fx-control>
                    <fx-control ref="@when" create="create">
                        <label>
                            <pb-i18n key="form.date-of-verification"/>
                        </label>
                        <input placeholder="YYYY-MM-DD" class="widget" />
                    </fx-control>
                </fx-group>

                <fx-control ref="persName">
                    <label>
                        <pb-i18n key="form.verification-by">Verifizierer</pb-i18n>
                    </label>
                </fx-control>
                
                <fx-trigger>
                    <pb-popover>
                        <edep-icon name="remove-circle-outline"></edep-icon>
                        <template slot="alternate">
                            <pb-i18n key="form.hint-delete-verification"></pb-i18n
                            ></template>
                    </pb-popover>
                    <fx-delete ref="."></fx-delete>
                </fx-trigger>
            </template>
        </fx-repeat>
        <fx-trigger class="add">
            <pb-popover>
                <edep-icon name="add-circle-outline"></edep-icon>
                <template slot="alternate">
                    <pb-i18n key="form.hint-add-verification"> </pb-i18n
                    ></template>
            </pb-popover>
            <fx-insert
                context="fileDesc/titleStmt"
                ref="respStmt"
                origin="instance('templates')//respStmt"></fx-insert>
        </fx-trigger>
    </fx-group>
</details>
