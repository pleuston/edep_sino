<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html",
            "modules": {
                "http://epiwen.org/templates/jinshi": {
                    "at": "modules/templates/jinshi.xqm",
                    "prefix": "jinshi"
                }
            }
        },
        "features": {
            "toolbar": {
                "zoom": false,
                "navigation": false
            },
            "timeline": {
                "enabled": false
            },
            "upload": {
                "enabled": false
            }
        },
        "styles": [
            "transform/teipublisher.css",
            "resources/css/registers-theme.css",
            "resources/css/jinshi.css"
        ],
        "theme": {
            "layout": {
                "after-width": "min(30vw, 356px)"
            }
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li><a href="[[ $context-path ]]/jinshi-inscriptions"><pb-i18n key="menu.jinshi"/></a></li>
                <li>[[ head(($entity-data?root//tei:objectName[@type = 'main'], $entity-data?root//tei:objectName))/string() ]]</li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]
    <section class="jinshi-inscription jinshi-detail">
        <h1 class="zh">[[ head(($entity-data?root//tei:objectName[@type = 'main'], $entity-data?root//tei:objectName))/string() ]]</h1>
        <p class="pinyin">[[ $entity-data?root//tei:objectName[@type = 'sort']/string() ]]</p>
        [% if exists($entity-data?root//tei:objectName[@type = 'alt']) %]
        <p class="altnames zh">[[ string-join($entity-data?root//tei:objectName[@type = 'alt'], '；') ]]</p>
        [% endif %]

        <dl class="work-meta">
            [% if $entity-data?root//tei:origin/tei:origDate != '' %]
            <dt><pb-i18n key="jinshi.origin">Origin</pb-i18n></dt>
            <dd>[[ $entity-data?root//tei:origin/tei:origDate/string() ]]
                [% if $entity-data?root//tei:origin/tei:origPlace != '' %]
                · <span class="zh">[[ $entity-data?root//tei:origin/tei:origPlace/string() ]]</span>
                [% endif %]</dd>
            [% endif %]
        </dl>

        [% let $corpus = jinshi:corpus-doc-for($entity-data?id) %]
        [% if exists($corpus) %]
        <section class="corpus-link">
            [% for $c in $corpus %]
            <a class="corpus-edition" href="[[ $context-path ]]/[[ $c?file ]]">
                <pb-i18n key="jinshi.corpus-edition">Edition in this corpus</pb-i18n>: <span class="zh">[[ $c?title ]]</span>
            </a>
            [% endfor %]
        </section>
        [% endif %]
        [% endlet %]

        [% let $atts = jinshi:attestations-of($entity-data?id) %]
        [% if exists($atts) %]
        <section class="attestations">
            <h2><pb-i18n key="jinshi.attestations">Recorded in 歷代著錄</pb-i18n>
                <span class="count">([[ count($atts) ]])</span></h2>
            <ol class="attestation-list">
                [% for $a in $atts %]
                <li>
                    <span class="work-date">[[ $a?work-date ]]</span>
                    <a class="zh work-title" href="[[ $context-path ]]/works/[[ $a?work-id ]]">[[ $a?work-title ]]</a>
                    [% if $a?work-author != '' %]<span class="zh work-author">[[ $a?work-author ]]</span>[% endif %]
                    [% if $a?title-in-work != '' %]
                    <span class="title-in-work"><pb-i18n key="jinshi.title-in-work">as</pb-i18n>
                        <span class="zh">「[[ $a?title-in-work ]]」</span></span>
                    [% endif %]
                    [% if $a?juan != '' %]<span class="juan">卷[[ $a?juan ]]</span>[% endif %]
                    [% if $a?note != '' %]<small class="note zh">[[ $a?note ]]</small>[% endif %]
                </li>
                [% endfor %]
            </ol>
        </section>
        [% endif %]
        [% endlet %]

        [% if exists($entity-data?root//tei:surrogates/tei:bibl) %]
        <section class="rubbings">
            <h2><pb-i18n key="jinshi.rubbings">Rubbings 拓本</pb-i18n></h2>
            <ul>
                [% for $r in $entity-data?root//tei:surrogates/tei:bibl %]
                <li>
                    [% if $r/tei:ref/@target != '' %]
                    <a href="[[ $r/tei:ref/@target ]]" target="_blank" rel="noopener">
                        <span class="zh">[[ head(($r/tei:title[. != ''], $r/tei:ref))/string() ]]</span> — [[ $r/tei:ref/string() ]]</a>
                    [% else %]
                    <span class="zh">[[ $r/string() ]]</span>
                    [% endif %]
                </li>
                [% endfor %]
            </ul>
        </section>
        [% endif %]

        [% for $n in $entity-data?root/tei:note[not(@type = 'source')] %]
        <p class="note">[[ $n/string() ]]</p>
        [% endfor %]
    </section>
</template>
