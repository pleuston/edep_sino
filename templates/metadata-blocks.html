<?xml version="1.0" encoding="UTF-8"?>
<template>
    [% template after %]
        [% if exists($context?doc) and $context?features?metadata?enabled %]
        [% if $context?theme?layout?after?mode = 'tabs' %]
            <div class="tab-panel">
                <span class="tab-title"><pb-i18n key="tabs.metadata">Metadata</pb-i18n></span>
                <div class="metadata-panel">
                    <pb-view src="document1" subscribe="transcription" view="single" disable-history="">
                        <pb-param name="mode" value="metadata-panel"/>
                    </pb-view>
                </div>
            </div>
        [% else %]
            <div class="metadata-panel">
                <h2>
                    <pb-i18n key="tabs.metadata"/>
                </h2>
                <pb-view src="document1" subscribe="transcription" view="single" disable-history="">
                    <pb-param name="mode" value="metadata-panel"/>
                </pb-view>
            </div>
        [% endif %]
        [# jinshi authority cross-reference: attestation history of this stone
           (doc/sino-model.md par.10) #]
        [% let $auth = jinshi:authority-for-corpus-doc($context?doc?path) %]
        [% if exists($auth) %]
        <div class="jinshi-authority">
            <h2><pb-i18n key="jinshi.authority-record">Authority record 石刻總目</pb-i18n></h2>
            [% for $a in $auth %]
            <p>
                <a class="zh" href="[[ $context-path ]]/[[ head(($a?route, 'jinshi-inscriptions')) ]]/[[ $a?id ]]">[[ $a?name ]]</a>
                [% if $a?attestations gt 0 %]
                <span class="attestation-count">([[ $a?attestations ]] <pb-i18n key="jinshi.attestation-count">attestations</pb-i18n>)</span>
                [% endif %]
            </p>
            [% endfor %]
        </div>
        [% endif %]
        [% endlet %]
        [% endif %]
    [% endtemplate %]
</template>
