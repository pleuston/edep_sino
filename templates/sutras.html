<?xml version="1.0" encoding="UTF-8"?>
<div class="people">
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html"
        },
        "features": {
            "toolbar": {
                "zoom": false,
                "navigation": false
            },
            "timeline": {
                "enabled": false
            },
            "upload": {
                "enabled": false
            }
        }
    }
    ---
    [% template breadcrumb %]
    <li>
        <nav aria-label="breadcrumb">
            <ul>
                <li><a href="[[ $context-path ]]/sutras"><pb-i18n key="menu.sutras"/></a></li>
            </ul>
        </nav>
    </li>
    [% endtemplate %]
    <div class="list">
        <pb-custom-form id="options" auto-submit="input change" emit="transcription">
            <input id="query" type="search" name="search" data-i18n="[placeholder]search.search" value="[[ $request?parameters?search ]]"/>
            <select name="genre" aria-label="genre">
                <option value="">— 類別 / genre —</option>
                <option value="foming">佛名 · Buddha-name</option>
                <option value="kejing">刻經 · sutra engraving</option>
                <option value="tiji">題記 · colophon</option>
            </select>
            <select name="corpus" aria-label="corpus">
                <option value="">— 石經叢 / corpus —</option>
                <option value="Hongdingshan">洪頂山 · Hongdingshan</option>
            </select>
        </pb-custom-form>
        <pb-split-list url="api/sutras" subforms="#options" selected="A" emit="transcription" subscribe="transcription"/>
    </div>
</div>
